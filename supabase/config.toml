# Supabase local stack for JewelVault (Supabase CLI 2.120.0, pinned in package.json; Postgres 17).
#
# This file is the committed template. Nobody runs it directly: scripts/lane.mjs writes a copy for each agent's lane into
# .lanes/<lane>/supabase/ with its own project id (jv-<lane>) and its own port block, so several stacks can run on one Mac:
#
#   lane   project id   ports                  dev server
#   main   jv-main      443xx (as below)       4028
#   a      jv-a         453xx                  4128
#   b      jv-b         463xx                  4228
#   c      jv-c         473xx                  4328
#
# The default Supabase block 543xx stays free because Harsh's other project uses it on this Mac, and every port is below
# 49152, where the operating system starts handing out its own temporary ports. Only the main block is written here.
project_id = "jewelvault"

[api]
enabled = true
port = 44321
# S1: the API exposes the public schema only. The default also lists storage and graphql_public.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# C3: a response is cut at 1,000 rows, so the screens page their reads. The build check of H3 asserts this value.
max_rows = 1000
# The worst case on purpose: every new table, view, sequence and function in public is reachable by anon, authenticated
# and service_role until it is revoked, so the access tests prove the revokes of migration 0001 (A3). The hosted
# project's own setting is read in DB21.
auto_expose_new_tables = true

[api.tls]
enabled = false

[db]
port = 44322
shadow_port = 44320
major_version = 17

[db.pooler]
enabled = false
port = 44329

[db.migrations]
enabled = true

[db.seed]
# S9, H5: the seeds are local only. seeds/00_guard.sql refuses any database whose JWT secret is not the published local
# default, so they cannot run on a hosted project. Production gets the migrations alone (spec D20).
enabled = true
sql_paths = ["./seeds/*.sql"]

# Services the tests do not need stay off: five containers (database, auth, api gateway, rest, storage) use about 350 MB.
[realtime]
enabled = false

[studio]
enabled = false
port = 44323

[local_smtp]
enabled = false
port = 44324

[edge_runtime]
enabled = false

[analytics]
enabled = false
port = 44327

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:4028"
additional_redirect_urls = ["http://127.0.0.1:4028"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# U2: logins are created by Harsh in the dashboard (and by the tests through the Auth admin API), never by sign-up.
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
# U9: passwords are at least 10 characters.
minimum_password_length = 10
password_requirements = ""

# The browser tests log in and out many times from one address. The defaults (30 sign-ins and 150 refreshes in five
# minutes) would end a run with rate-limit errors that have nothing to do with the code under test, so the local stack
# allows more. The hosted limits are not changed by this file.
[auth.rate_limit]
sign_in_sign_ups = 300
token_refresh = 600
token_verifications = 300

[auth.email]
# This is the email-and-password provider (login), not public sign-up, which [auth] enable_signup turns off.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600
